[project]
name = "telegram-scheduler-bot"
version = "0.1.0"
description = "A Telegram bot for scheduling posts to multiple channels with flexible scheduling options."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright",
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Ruff: linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # import sorting
    "N",    # naming conventions
    "UP",   # modernize syntax to target version
    "B",    # common bug patterns
    "A",    # shadowing builtins
    "C4",   # comprehension improvements
    "C90",  # complexity (KISS tripwire)
    "SIM",  # simplification opportunities
    "RUF",  # ruff-specific rules
    "PL",   # pylint rules (too many branches/statements/returns)
    "TRY",  # exception handling antipatterns
    "PTH",  # force pathlib over os.path
    "LOG",  # logging module misuse
    "G",    # logging format strings
    "T20",  # forbid print() outside designated places
    "RET",  # return statement cleanups
    "ARG",  # unused function arguments
    "DTZ",  # naive datetime misuse
    "S",    # security checks (bandit)
]
ignore = [
    "PLR0913",  # too many arguments: sometimes unavoidable
    "TRY003",   # long exception messages: fine for small projects
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is the whole point of pytest
    "PLR2004",  # magic values in assertions are fine
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pyright: strict type checking
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
